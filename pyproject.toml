[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "training-kb"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2,<3", "boto3>=1.35,<2", "jsonschema>=4,<5"]

[dependency-groups]
dev = [
    "mypy>=1,<2",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
    "moto[dynamodb,s3]>=5,<6",
    "boto3-stubs[dynamodb,s3,bedrock,bedrock-runtime,stepfunctions,sts]>=1.35,<2",
    "aws-cdk-lib>=2,<3",
    "constructs>=10,<11",
    "types-jsonschema>=4,<5",
    # 本機測試工單 xlsx（demo/ticket_files.py）；不進 Lambda runtime。
    "openpyxl>=3.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
training_kb = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# demo/ 與 infra/ 不在 [tool.setuptools.packages.find] 的 where = ["src"] 內，
# 但測試要 import 它們；pytest 8 內建的 pythonpath 把專案根加進 sys.path（Phase 56）。
pythonpath = ["."]
markers = [
    "aws: 需要真實 AWS 帳號與憑證的整合測試；未設 TKB_RUN_AWS_INTEGRATION=1 時由 tests/conftest.py 自動跳過",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "infra", "demo"]
