[project]
name = "support-tutorial-generator"
version = "0.1.0"
description = "客服自助教學生成器（Self-Improving Support Tutorial Generator）— Data and AI Hackathon 2026-09-11"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.38",
    "pandas>=2.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "huggingface_hub>=0.24",
    "pyarrow>=17",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要真實外部服務（hotdata / Cognee）的煙測；沒設定 env 會 skip",
]
