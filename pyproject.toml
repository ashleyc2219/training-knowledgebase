[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "training-kb"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2,<3", "boto3>=1.35,<2"]

[dependency-groups]
dev = [
    "mypy>=1,<2",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
    "moto[dynamodb,s3]>=5,<6",
    "boto3-stubs[dynamodb,s3,bedrock,bedrock-runtime,stepfunctions,sts]>=1.35,<2",
    "aws-cdk-lib>=2,<3",
    "constructs>=10,<11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
